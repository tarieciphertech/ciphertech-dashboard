name: Fix Reports runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Reports runtime state') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Reports initial state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/OperationalApp.jsx')
          s = p.read_text()
          old = "function ReportsPage(){const[state,setState]=useState({});"
          new = "function ReportsPage(){const[state,setState]=useState({overview:{},months:[],loading:true,error:''});"
          if old not in s:
              raise SystemExit('ReportsPage initial state pattern not found')
          s = s.replace(old, new, 1)
          old_effect = ".then(([a,b])=>setState({overview:a.data||{},months:b.data||[],error:a.error?.message||b.error?.message}))"
          new_effect = ".then(([a,b])=>setState({overview:a.data||{},months:b.data||[],loading:false,error:a.error?.message||b.error?.message||''})).catch(err=>setState(x=>({...x,loading:false,error:err.message||'Unable to load reports.'})))"
          if old_effect not in s:
              raise SystemExit('ReportsPage effect pattern not found')
          s = s.replace(old_effect, new_effect, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-reports-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/OperationalApp.jsx .github/workflows/fix-reports-runtime.yml
          git commit -m 'Fix Reports runtime state'
          git push
